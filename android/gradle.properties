org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Disable Kotlin incremental compilation: the Build Tools API fails to close
# incremental caches on Windows ("Could not close incremental caches" .tab files).
kotlin.incremental=false
# R8: let resource shrinking run through R8's optimized pipeline (Play's
# "R8 optimization" recommendation), and keep full-mode keep-rule semantics
# lenient for third-party consumer rules.
android.r8.optimizedResourceShrinking=true
android.r8.strictFullModeForKeepRules=false

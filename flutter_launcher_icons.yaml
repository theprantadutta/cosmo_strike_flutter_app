# Launcher icons — sources live in assets/icon/ (NOT bundled into the app).
# Brand mark: Material rocket_launch glyph in neon cyan (#22D3EE) on the
# deep-space background (#05060F).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_background: "#05060F"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#05060F"
  image_path_ios_dark_transparent: "assets/icon/icon_dark.png"
  desaturate_tinted_to_grayscale_ios: true

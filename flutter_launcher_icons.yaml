# Launcher icons — Prism Noir rocket mark. Sources live in assets/branding/
# (NOT bundled into the app).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/branding/icon-1024-master.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/branding/ic_launcher_foreground-1024.png"
  adaptive_icon_background: "assets/branding/ic_launcher_background-1024.png"
  adaptive_icon_monochrome: "assets/branding/ic_launcher_monochrome-1024.png"
  # The kit art already carries its own padding; 8% (not the default 16%)
  # keeps the rocket large while its nose stays inside circular masks.
  adaptive_icon_foreground_inset: 8
  remove_alpha_ios: true
  background_color_ios: "#0A0A0D"
  web:
    generate: true
    image_path: "assets/branding/icon-512.png"
    background_color: "#0A0A0D"
    theme_color: "#0A0A0D"

name: cosmo_strike_flutter_app
description: "Cosmo Strike — a retro side-scrolling shoot-'em-up (Space Impact remake)."

publish_to: 'none'

version: 3.2.1+19

environment:
  # google_mobile_ads 8.0.0 requires Dart >= 3.10.0.
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # State management
  provider: ^6.1.5+1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  equatable: ^3.0.0
  flutter_riverpod: ^3.4.3

  # Dependency injection
  get_it: ^9.3.0

  # Functional programming helpers
  dartz: ^0.10.1

  # Audio system
  audioplayers: ^6.8.1
  flutter_soloud: ^5.2.0

  # Persistent storage
  shared_preferences: ^2.5.6

  # Drift database for offline-first storage
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Animations and effects
  # Fonts (Syne + IBM Plex Mono) are bundled as assets under assets/fonts/ and
  # declared in the flutter: fonts: section — no runtime download, fully offline.

  # Vector math for game calculations
  vector_math: ^2.4.3

  # UUID for unique identifiers
  uuid: ^4.6.0

  # Native in-app review prompts (Google Play + StoreKit)
  in_app_review: ^2.0.12

  # Firebase dependencies. Held on the pre-Firebase-iOS-SDK-13 majors:
  # FlutterFire core 5 / auth 7 / messaging 17 need Firebase iOS SDK 13, which
  # conflicts with google_sign_in_ios 6.3.x (GoogleSignIn-iOS 9). Upgrade them
  # together once google_sign_in ships a GoogleSignIn-iOS 10 release.
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  firebase_analytics: ^12.6.0
  # Crash reporting + performance monitoring
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  # Remote-tunable ad cadence (AdTuning) — defaults live in code, so ads
  # work offline / before the first fetch.
  firebase_remote_config: ^6.7.0

  # Connectivity for offline/online detection
  connectivity_plus: ^7.3.1

  # Beautiful logging library
  talker: ^5.1.20
  talker_flutter: ^5.1.20

  # Enhanced UI components for auth
  flutter_dotenv: ^6.0.1
  font_awesome_flutter: ^11.0.0

  # Push notifications
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # HTTP client for backend communication
  http: ^1.6.0

  # SignalR for real-time multiplayer (replaces WebSocket)
  signalr_netcore: ^1.4.4

  # In-app purchases over OpenIAP: Play Billing 9.1.0 (required by Play from
  # 2026-11-01) and StoreKit 2. Replaces in_app_purchase(+_android).
  flutter_inapp_purchase: ^11.0.0

  # Ads (AdMob). Bundles the UMP consent SDK. Pro users never see ads.
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.7

  # URL launcher for external links
  url_launcher: ^6.3.3

  # Native OS share sheet (Share App feature)
  share_plus: ^13.3.1

  # In-app updates from Play Store
  in_app_update: ^5.0.0

  # Declarative routing
  go_router: ^18.0.2
  # go_router 18 depends on the decoupled Material package, which declares its
  # own MaterialLocalizations type. Direct dep so main.dart can register its
  # delegates.
  material_ui: ^1.6.0

  # For Splash Screen
  flutter_native_splash: ^2.4.8
  package_info_plus: ^10.2.2
  flame: ^1.38.2
  flame_audio: ^2.12.2
  material_symbols_icons: ^4.2960.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: "^0.14.4"

  # Drift code generation
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:

  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/brand/
    - assets/images/ui/
    # Gameplay sprites (Flutter asset dirs are not recursive — list each).
    - assets/game/player/
    - assets/game/enemies/
    - assets/game/bosses/
    - assets/game/projectiles/
    - assets/game/powerups/
    - assets/game/fx/
    - assets/game/terrain/
    - PRIVACY.md
    - .env

  # Prism Noir type. Syne ships upstream as a variable font; static
  # instances (400-800) are cut from it with fontTools so FontWeight maps to
  # real masters on every platform. IBM Plex Mono covers labels and numbers.
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/syne/Syne-400.ttf
          weight: 400
        - asset: assets/fonts/syne/Syne-500.ttf
          weight: 500
        - asset: assets/fonts/syne/Syne-600.ttf
          weight: 600
        - asset: assets/fonts/syne/Syne-700.ttf
          weight: 700
        - asset: assets/fonts/syne/Syne-800.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
